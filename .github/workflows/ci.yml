name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --force --no-tags --depth=1 origin "$env:GITHUB_REF"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch $env:GITHUB_REF"
          }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Could not check out the workflow revision."
          }

      - name: Show toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install pinned build dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run Chromium audio-hook smoke test
        env:
          REQUIRE_BROWSER_SMOKE: "1"
        run: node scripts/browser-smoke.mjs

      - name: Run Firefox audio-hook smoke test
        env:
          REQUIRE_BROWSER_SMOKE: "1"
        run: node scripts/firefox-smoke.mjs

      - name: Build Firefox and Chrome packages
        shell: powershell
        run: .\scripts\build.ps1

      - name: Verify package outputs
        shell: pwsh
        run: |
          $firefox = @(Get-ChildItem -LiteralPath dist -Filter 'volume-control-firefox-v*.zip')
          $chrome = @(Get-ChildItem -LiteralPath dist -Filter 'volume-control-chrome-v*.zip')

          if ($firefox.Count -ne 1) {
              throw "Expected exactly one Firefox package, found $($firefox.Count)."
          }
          if ($chrome.Count -ne 1) {
              throw "Expected exactly one Chrome package, found $($chrome.Count)."
          }

          Write-Host "Firefox: $($firefox[0].Name) ($($firefox[0].Length) bytes)"
          Write-Host "Chrome:  $($chrome[0].Name) ($($chrome[0].Length) bytes)"

