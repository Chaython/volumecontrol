name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # Recheck browser/runtime compatibility after hosted browser updates.
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

# A newer push supersedes older checks for the same branch. Never abort
# the main branch's own post-merge validation.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --force --no-tags --depth=1 origin "$env:GITHUB_REF"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch $env:GITHUB_REF"
          }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Could not check out the workflow revision."
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install pinned build dependencies
        run: npm ci

      # The committed root userscript is the release-quality canonical artifact.
      # Keep GitHub Pages in sync with it; do not regenerate/replace it from the
      # template during CI, which can publish an older or less complete copy.
      - name: Sync canonical Tampermonkey userscript for regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $canonical = "tampermonkey/volume-control.user.js"
          $published = "website/public/tampermonkey/volume-control.user.js"
          if (-not (Test-Path -LiteralPath $canonical)) {
              throw "Canonical Tampermonkey userscript is missing: $canonical"
          }
          New-Item -ItemType Directory -Path (Split-Path -Parent $published) -Force | Out-Null
          Copy-Item -LiteralPath $canonical -Destination $published -Force
          $canonicalHash = (Get-FileHash -LiteralPath $canonical -Algorithm SHA256).Hash
          $publishedHash = (Get-FileHash -LiteralPath $published -Algorithm SHA256).Hash
          if ($canonicalHash -ne $publishedHash) {
              throw "GitHub Pages userscript does not match the canonical Tampermonkey script."
          }
          Write-Host "Canonical userscript synchronized ($canonicalHash)."

      - name: Run regression tests
        run: npm test

      - name: Simulate Firefox and Chromium EME/DRM playback
        run: npm run test:eme

      - name: Build Firefox and Chrome packages
        shell: powershell
        run: .\scripts\build.ps1

      - name: Verify package outputs
        shell: pwsh
        run: |
          $firefox = @(Get-ChildItem -LiteralPath dist -Filter 'volume-control-firefox-v*.zip')
          $chrome = @(Get-ChildItem -LiteralPath dist -Filter 'volume-control-chrome-v*.zip')

          if ($firefox.Count -ne 1) {
              throw "Expected exactly one Firefox package, found $($firefox.Count)."
          }
          if ($chrome.Count -ne 1) {
              throw "Expected exactly one Chrome package, found $($chrome.Count)."
          }

          Write-Host "Firefox: $($firefox[0].Name) ($($firefox[0].Length) bytes)"
          Write-Host "Chrome:  $($chrome[0].Name) ($($chrome[0].Length) bytes)"

      - name: Extract release ZIPs for artifact-boundary smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json
          $version = [string]$manifest.version
          $smokeRoot = Join-Path $PWD "dist\smoke"
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $smokeRoot "chrome") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $smokeRoot "firefox") -Force | Out-Null

          Expand-Archive -LiteralPath "dist\volume-control-chrome-v$version.zip" -DestinationPath (Join-Path $smokeRoot "chrome") -Force
          Expand-Archive -LiteralPath "dist\volume-control-firefox-v$version.zip" -DestinationPath (Join-Path $smokeRoot "firefox") -Force

          foreach ($browser in @("chrome", "firefox")) {
              $root = Join-Path $smokeRoot $browser
              if (-not (Test-Path -LiteralPath (Join-Path $root "manifest.json"))) {
                  throw "$browser release ZIP did not extract a manifest at the package root."
              }
          }

      - name: Smoke extracted Chromium hook
        env:
          REQUIRE_BROWSER_SMOKE: "1"
          VC_EXTENSION_DIR: dist/smoke/chrome
        run: node scripts/browser-smoke.mjs

      - name: Smoke extracted Firefox hook
        env:
          REQUIRE_BROWSER_SMOKE: "1"
          VC_EXTENSION_DIR: dist/smoke/firefox
        run: node scripts/firefox-smoke.mjs

      - name: Load extracted Chromium extension in-browser
        env:
          VC_EXTENSION_DIR: dist/smoke/chrome
        run: node scripts/chromium-extension-smoke.mjs

      - name: Exercise installed Chromium extension functionality
        env:
          VC_EXTENSION_DIR: dist/smoke/chrome
        run: node scripts/chromium-functional-smoke.mjs

      - name: Temporarily install extracted Firefox extension
        env:
          VC_EXTENSION_DIR: dist/smoke/firefox
        run: node scripts/firefox-extension-smoke.mjs


  node-compatibility:
    name: Node.js ${{ matrix.node-version }} compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Show runtime versions
        shell: pwsh
        run: |
          node --version
          npm --version
          $PSVersionTable.PSVersion.ToString()

      - name: Install pinned dependencies
        run: npm ci

      # Keep the compatibility matrix testing the canonical release-quality
      # userscript, just like the primary build job.
      - name: Sync canonical Tampermonkey userscript for regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $canonical = "tampermonkey/volume-control.user.js"
          $published = "website/public/tampermonkey/volume-control.user.js"
          if (-not (Test-Path -LiteralPath $canonical)) {
              throw "Canonical Tampermonkey userscript is missing: $canonical"
          }
          New-Item -ItemType Directory -Path (Split-Path -Parent $published) -Force | Out-Null
          Copy-Item -LiteralPath $canonical -Destination $published -Force
          $canonicalHash = (Get-FileHash -LiteralPath $canonical -Algorithm SHA256).Hash
          $publishedHash = (Get-FileHash -LiteralPath $published -Algorithm SHA256).Hash
          if ($canonicalHash -ne $publishedHash) {
              throw "GitHub Pages userscript does not match the canonical Tampermonkey script."
          }
          Write-Host "Canonical userscript synchronized ($canonicalHash)."

      - name: Run regression suite
        run: npm test

      - name: Run EME lifecycle simulations
        run: npm run test:eme

      - name: Verify package builds on this Node version
        shell: powershell
        run: .\scripts\build.ps1

      - name: Verify both browser packages were produced
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json
          foreach ($browser in @("chrome", "firefox")) {
              $package = Join-Path "dist" ("volume-control-" + $browser + "-v" + $manifest.version + ".zip")
              if (-not (Test-Path -LiteralPath $package)) {
                  throw "Missing $browser package: $package"
              }
              $item = Get-Item -LiteralPath $package
              if ($item.Length -lt 1024) { throw "$browser package is unexpectedly small." }
              Write-Host "$browser package verified: $($item.Length) bytes"
          }
