name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --force --no-tags --depth=1 origin "$env:GITHUB_REF"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch $env:GITHUB_REF"
          }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Could not check out the workflow revision."
          }

      - name: Show toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install pinned build dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build Firefox and Chrome packages
        shell: powershell
        run: .\scripts\build.ps1

      - name: Verify package outputs
        shell: pwsh
        run: |
          $firefox = @(Get-ChildItem -LiteralPath dist -Filter 'volume-control-firefox-v*.zip')
          $chrome = @(Get-ChildItem -LiteralPath dist -Filter 'volume-control-chrome-v*.zip')

          if ($firefox.Count -ne 1) {
              throw "Expected exactly one Firefox package, found $($firefox.Count)."
          }
          if ($chrome.Count -ne 1) {
              throw "Expected exactly one Chrome package, found $($chrome.Count)."
          }

          Write-Host "Firefox: $($firefox[0].Name) ($($firefox[0].Length) bytes)"
          Write-Host "Chrome:  $($chrome[0].Name) ($($chrome[0].Length) bytes)"

      - name: Extract release ZIPs for artifact-boundary smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json
          $version = [string]$manifest.version
          $smokeRoot = Join-Path $PWD "dist\smoke"
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $smokeRoot "chrome") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $smokeRoot "firefox") -Force | Out-Null

          Expand-Archive -LiteralPath "dist\volume-control-chrome-v$version.zip" -DestinationPath (Join-Path $smokeRoot "chrome") -Force
          Expand-Archive -LiteralPath "dist\volume-control-firefox-v$version.zip" -DestinationPath (Join-Path $smokeRoot "firefox") -Force

          foreach ($browser in @("chrome", "firefox")) {
              $root = Join-Path $smokeRoot $browser
              if (-not (Test-Path -LiteralPath (Join-Path $root "manifest.json"))) {
                  throw "$browser release ZIP did not extract a manifest at the package root."
              }
          }

      - name: Smoke extracted Chromium hook
        env:
          REQUIRE_BROWSER_SMOKE: "1"
          VC_EXTENSION_DIR: dist/smoke/chrome
        run: node scripts/browser-smoke.mjs

      - name: Smoke extracted Firefox hook
        env:
          REQUIRE_BROWSER_SMOKE: "1"
          VC_EXTENSION_DIR: dist/smoke/firefox
        run: node scripts/firefox-smoke.mjs

      - name: Load extracted Chromium extension in-browser
        env:
          VC_EXTENSION_DIR: dist/smoke/chrome
        run: node scripts/chromium-extension-smoke.mjs

      - name: Exercise installed Chromium extension functionality
        env:
          VC_EXTENSION_DIR: dist/smoke/chrome
        run: node scripts/chromium-functional-smoke.mjs

      - name: Temporarily install extracted Firefox extension
        env:
          VC_EXTENSION_DIR: dist/smoke/firefox
        run: node scripts/firefox-extension-smoke.mjs

