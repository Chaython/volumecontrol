name: Daily prerelease

on:
  schedule:
    # Runs once per day. GitHub Actions cron uses UTC.
    - cron: "17 09 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Create a prerelease even if no releasable files changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository and tags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --force --prune --tags origin
          if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch repository history and tags."
          }

          git checkout --detach "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not check out $env:GITHUB_SHA."
          }

      - name: Check for releasable changes
        id: changes
        shell: pwsh
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
        run: |
          $ErrorActionPreference = "Stop"

          $head = (git rev-parse HEAD).Trim()
          $shortSha = $head.Substring(0, 7)
          $lastTag = git tag --list "V*" --sort=-creatordate |
            Where-Object { $_ -match '^V\d+(?:\.\d+)+(?:-pre\..+)?$' } |
            Select-Object -First 1
          $force = $env:FORCE_RELEASE -eq "true"
          $shouldRelease = $false

          if ($force) {
              Write-Host "Manual force_release requested."
              $shouldRelease = $true
          }
          elseif (-not $lastTag) {
              Write-Host "No previous release/prerelease tag exists; creating the first automated prerelease."
              $shouldRelease = $true
          }
          else {
              $lastSha = (git rev-list -n 1 $lastTag).Trim()

              if ($lastSha -eq $head) {
                  Write-Host "HEAD is already the commit used by $lastTag."
              }
              else {
                  $changedFiles = @(git diff --name-only "$lastTag..HEAD")
                  # Releasable paths: extension sources at the repo root, the
                  # packaging metadata, the Tampermonkey userscript edition
                  # (tampermonkey/** plus its builder), and the popup.css port
                  # the userscript embeds from the website sources.
                  $releasableFiles = @(
                      $changedFiles | Where-Object {
                          $_ -match '^[^/]+\.(js|html|css)$' -or
                          $_ -match '^tampermonkey/' -or
                          $_ -in @(
                              'manifest.json',
                              'ico.svg',
                              'chrome.png',
                              'package.json',
                              'package-lock.json',
                              'LICENSE',
                              'scripts/build.ps1',
                              'scripts/minify.mjs',
                              'scripts/build-userscript.mjs',
                              'website/src/components/demo/popup.css'
                          )
                      }
                  )

                  if ($changedFiles.Count -gt 0) {
                      Write-Host "Changes since $($lastTag):"
                      $changedFiles | ForEach-Object { Write-Host "  $_" }
                  }

                  if ($releasableFiles.Count -gt 0) {
                      Write-Host "Releasable changes detected:"
                      $releasableFiles | ForEach-Object { Write-Host "  $_" }
                      $shouldRelease = $true
                  }
                  else {
                      Write-Host "Only documentation/workflow/test-only changes were made; skipping prerelease."
                  }
              }
          }

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "last_tag=$lastTag" >> $env:GITHUB_OUTPUT
          "head=$head" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Show toolchain versions
        if: steps.changes.outputs.should_release == 'true'
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          gh --version
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install pinned build dependencies
        if: steps.changes.outputs.should_release == 'true'
        run: npm ci

      - name: Validate minifier toolchain
        if: steps.changes.outputs.should_release == 'true'
        run: node scripts/minify.mjs --check

      - name: Run regression tests
        if: steps.changes.outputs.should_release == 'true'
        run: npm test

      - name: Run Chromium audio-hook smoke test
        if: steps.changes.outputs.should_release == 'true'
        env:
          REQUIRE_BROWSER_SMOKE: "1"
        run: node scripts/browser-smoke.mjs

      - name: Run Firefox audio-hook smoke test
        if: steps.changes.outputs.should_release == 'true'
        env:
          REQUIRE_BROWSER_SMOKE: "1"
        run: node scripts/firefox-smoke.mjs

      - name: Build and minify Firefox and Chrome packages
        if: steps.changes.outputs.should_release == 'true'
        shell: powershell
        run: .\scripts\build.ps1

      - name: Build and validate Tampermonkey userscript
        if: steps.changes.outputs.should_release == 'true'
        id: userscript
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath tampermonkey/userscript-template.js)) {
              Write-Host "tampermonkey/userscript-template.js not found; publishing without the userscript asset."
              "path=" >> $env:GITHUB_OUTPUT
              exit 0
          }

          node scripts/build-userscript.mjs
          if ($LASTEXITCODE -ne 0) { throw "Userscript build failed." }

          $manifest = Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json
          $text = Get-Content -Raw -LiteralPath tampermonkey/volume-control.user.js
          # @version = manifest version + userscript-edition revision
          # (USERSCRIPT_REVISION in scripts/build-userscript.mjs), so accept
          # the manifest version with an optional .N revision suffix.
          if ($text -notmatch (("(?m)^//\s*@version\s+" + [regex]::Escape($manifest.version)) + "(\.\d+)?\s*$")) { throw "Userscript @version does not match manifest v$($manifest.version) (+ userscript revision)." }
          if ($text -match "__ENGINE_SOURCE__|__POPUP_CSS__|__VERSION__") { throw "Userscript contains unsubstituted placeholders." }
          if (-not $text.Contains("__volumeControlPageAudioHook")) { throw "Userscript does not embed the page-audio-hook engine." }

          node --check tampermonkey/volume-control.user.js
          if ($LASTEXITCODE -ne 0) { throw "Userscript failed node --check." }

          Copy-Item -LiteralPath tampermonkey/volume-control.user.js -Destination dist/volume-control.user.js
          "path=dist/volume-control.user.js" >> $env:GITHUB_OUTPUT
          Write-Host "Staged Tampermonkey userscript for the prerelease."

      - name: Extract both prerelease packages for installed-browser checks
        if: steps.changes.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = [string](Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json).version
          foreach ($browser in @("chrome", "firefox")) {
              $zip = "dist/volume-control-$browser-v$version.zip"
              if (-not (Test-Path -LiteralPath $zip)) { throw "Missing $browser release archive: $zip" }
              $target = "dist/smoke/$browser"
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              Expand-Archive -LiteralPath $zip -DestinationPath $target -Force
              if (-not (Test-Path -LiteralPath "$target/manifest.json")) {
                  throw "Missing $browser manifest after ZIP extraction"
              }
          }

      - name: Exercise installed Chromium prerelease package
        if: steps.changes.outputs.should_release == 'true'
        env:
          VC_EXTENSION_DIR: dist/smoke/chrome
        run: node scripts/chromium-functional-smoke.mjs

      - name: Temporarily install Firefox prerelease package
        if: steps.changes.outputs.should_release == 'true'
        env:
          VC_EXTENSION_DIR: dist/smoke/firefox
        run: node scripts/firefox-extension-smoke.mjs

      - name: Create SHA-256 checksums
        if: steps.changes.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' | Sort-Object Name)
          if ($packages.Count -ne 2) {
              throw "Expected exactly two extension ZIPs, found $($packages.Count)."
          }

          $files = @($packages | ForEach-Object { $_.FullName })
          $userscript = "${{ steps.userscript.outputs.path }}"
          if ($userscript) {
              if (-not (Test-Path -LiteralPath $userscript)) { throw "Userscript asset missing at $userscript." }
              $files += (Resolve-Path -LiteralPath $userscript).Path
          }

          $files |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path -Leaf $_)"
            } | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding utf8

      - name: Prepare prerelease metadata
        if: steps.changes.outputs.should_release == 'true'
        id: meta
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath manifest.json | ConvertFrom-Json
          $utcNow = (Get-Date).ToUniversalTime()
          $dateTag = $utcNow.ToString("yyyyMMdd")
          $dateDisplay = $utcNow.ToString("yyyy-MM-dd")
          $shortSha = "${{ steps.changes.outputs.short_sha }}"
          $tag = "V$($manifest.version)-pre.$dateTag.$env:GITHUB_RUN_NUMBER-$shortSha"
          $title = "V$($manifest.version): Pre-release $dateDisplay ($shortSha)"

          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub prerelease
        if: steps.changes.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ steps.meta.outputs.tag }}"
          $title = "${{ steps.meta.outputs.title }}"
          $assets = @(
              Get-ChildItem -LiteralPath dist -Filter '*.zip' |
                Sort-Object Name |
                ForEach-Object { $_.FullName }
          )
          $userscript = "${{ steps.userscript.outputs.path }}"
          if ($userscript) {
              $assets += (Resolve-Path -LiteralPath $userscript).Path
          }
          $assets += (Resolve-Path dist\SHA256SUMS.txt).Path

          $expected = if ($userscript) { 4 } else { 3 }
          if ($assets.Count -ne $expected) {
              throw "Expected Firefox ZIP, Chrome ZIP, $(if ($userscript) {'the userscript, '})and SHA256SUMS.txt before publishing; found $($assets.Count) assets."
          }

          gh release create $tag @assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --prerelease `
            --title "$title" `
            --generate-notes

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub prerelease creation failed."
          }
