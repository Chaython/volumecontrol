name: Deploy website to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
      - "docs/**"
      - "popup.css"
      - "page-audio-hook.js"
      - "manifest.json"
      - "tampermonkey/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Sync stats dashboard from docs/
        run: |
          cp -f docs/stats.html docs/stats.json docs/stats.svg docs/preview.html docs/preview.js website/public/
          cp -f popup.css website/public/
          sed -i 's|\.\./popup\.css|popup.css|g' website/public/preview.html

      - name: Build Tampermonkey userscript
        run: |
          if [ -f scripts/build-userscript.mjs ] && [ -f page-audio-hook.js ]; then
            node scripts/build-userscript.mjs
          elif [ -f tampermonkey/volume-control.user.js ]; then
            mkdir -p website/public/tampermonkey
            cp tampermonkey/volume-control.user.js website/public/tampermonkey/
            echo "[userscript] used committed root artifact"
          fi
          test -f website/public/tampermonkey/volume-control.user.js || {
            echo "::error::website/public/tampermonkey/volume-control.user.js missing (need scripts/build-userscript.mjs + page-audio-hook.js, a committed tampermonkey/ folder, or the file inside website/public/tampermonkey/)"
            exit 1
          }

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: website
        env:
          NEXT_PUBLIC_STATIC_MODE: "1"
          NEXT_PUBLIC_BASE_PATH: "/volumecontrol"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build:static

      - name: Verify static export
        working-directory: website
        run: |
          test -f out/index.html || { echo "::error::Static export did not produce out/index.html"; exit 1; }
          test -f out/stats.html || { echo "::error::Stats dashboard missing from export"; exit 1; }
          test -f out/tampermonkey/volume-control.user.js || { echo "::error::Tampermonkey userscript missing from export"; exit 1; }
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
